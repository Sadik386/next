[package]
name = "acuity-commerce"
version = "0.1.0"
description = "Acuity Commerce Desktop App"
authors = ["Acuity Commerce Team"]
license = "MIT"
repository = "https://github.com/acuitycommerce/acuitycommerce"
edition = "2021"
rust-version = "1.57"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open"] }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
